name: "03 - Workflow Runners"

on: push

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: "Show OS"
        run: |
          echo "This job is running on an Ubuntu runner."
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: "Show OS"
        shell: bash
        run: echo "This job running on a Windows runner."
  mac-echo:
    runs-on: macos-latest
    steps:
      - name: "Show OS"
        run: |
          echo "This jos is running on a MacOS runner."