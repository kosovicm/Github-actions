name: "19 - 1 - Managing Concurrency"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
on:
  workflow_dispatch:
  push:
    branches:
      - 'exercise-19'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping URL
        uses: ./.github/actions/docker-ping-url
        with:
          url: https://www.invalid-ubfadufhbaudhfua.com
          max_trials: 20
          delay: 5
          