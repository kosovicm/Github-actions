name: "Open PR"

on:
  pull_request:
    types: [opened,synchronized]


jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: echo "Start lint."
      - name: Unit test
        run: echo "Starting unit test."
      - name: Sonar
        run: echo "Starting sonar"
  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - checks
    steps:
      - name: Check of steps
        run: |
          if ["${{needs.checks.result}}" != "success"]; then
            exit 1
          fi