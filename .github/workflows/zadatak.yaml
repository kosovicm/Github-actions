name: "Create docker image and push to Docker Hub"

on:
  workflow_dispatch:
  push:
    branches:
      - zadatak-docker-runner

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: kosovicm/my-app:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build docker image
        run: |
          docker build -t my-app-from-runner .
          echo "Kreiranje docker image-a"
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      
      - name: Docker push
        run: |
          docker tag my-app-from-runner kosovicm/my-app-from-runner:latest
          docker push ${{secrets.DOCKER_USERNAME}}/my-app-from-runner:latest